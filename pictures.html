<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>हाम्रा तस्बिरहरू</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* The same notebook paper as the letter page. Our pictures are polaroids taped to it,
     newest on top, in whatever order we drag them into. */
  :root {
    --paper: #c3b9a7;
    --rule: color-mix(in srgb, #5c6876 55%, transparent);
    --margin: color-mix(in srgb, #c47868 70%, transparent);
    --ink: #1d2a50;
    --ink-soft: #55608a;
    --stamp: #a3333f;
    --polaroid: #fbf8f1;
    --gap: 44px;
  }
  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, transparent 119px, var(--margin) 119px, var(--margin) 121px, transparent 121px),
      linear-gradient(to bottom, transparent calc(var(--gap) - 2px), var(--rule) calc(var(--gap) - 2px), var(--rule) var(--gap));
    background-size: 100% 100%, 100% var(--gap);
    background-repeat: no-repeat, repeat;
  }
  body {
    margin: 0;
    min-height: 100dvh;
    color: var(--ink);
    font: italic 400 20px/1.4 "Lora", "Tiro Devanagari Hindi", serif;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px dashed var(--stamp); outline-offset: 3px; }

  .back {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 10;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--stamp);
    color: #f6efe2;
    font-size: 20px;
    line-height: 1;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(140, 47, 59, .35);
  }

  /* Asked only when the letter page was not opened first in this tab */
  .lock { padding: var(--gap) 24px 0 140px; font-weight: 300; font-size: 24px; line-height: var(--gap); }
  .lock[hidden] { display: none; }
  .lock p, .lock form { margin: 0; }
  .lock form { display: flex; align-items: center; gap: 14px; }
  .lock input, .lock button { background: transparent; border: 0; outline: none; height: var(--gap); }
  .lock input { width: 220px; letter-spacing: 2px; }
  .lock button { cursor: pointer; text-decoration: underline; text-underline-offset: 6px; }
  .lock .error { color: var(--stamp); min-height: var(--gap); }

  .album { width: min(1080px, 100vw - 32px); margin: 0 auto; padding: 36px 0 140px; }
  .album[hidden] { display: none; }
  .album h1 {
    margin: 0;
    font-size: clamp(44px, 7vw, 68px);
    line-height: 1.1;
    font-weight: 700;
    text-align: center;
    transform: rotate(-2deg);
  }
  .album .sub { margin: 6px 0 0; text-align: center; color: var(--ink-soft); font-weight: 300; }

  .pill {
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: transparent;
    padding: 0 14px;
    font-size: 17px;
    line-height: 32px;
    white-space: nowrap;
    cursor: pointer;
  }
  .pill:hover { background: var(--ink); color: #fbf6ea; }
  .pill.red { border-color: var(--stamp); color: var(--stamp); }
  .pill.red:hover, .pill.red.solid { background: var(--stamp); color: #fbf6ea; }
  .pill:disabled { opacity: .5; cursor: default; }
  .plain {
    border: 0;
    background: none;
    padding: 2px 0;
    font-size: 15px;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* a bit of masking tape at the top of each polaroid */
  .tape::before {
    content: "";
    position: absolute;
    z-index: 1;
    top: -11px;
    left: 50%;
    width: 78px;
    height: 22px;
    transform: translateX(-50%) rotate(var(--tape, 3deg));
    background: rgba(240, 232, 205, .8);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
  }

  /* The picker: an empty polaroid waiting for pictures */
  .drop {
    position: relative;
    display: block;
    width: min(300px, 100%);
    margin: 40px auto 0;
    padding: 12px 12px 0;
    background: var(--polaroid);
    box-shadow: 0 2px 4px rgba(40, 30, 20, .25), 0 8px 20px rgba(40, 30, 20, .18);
    transform: rotate(-2deg);
    transition: transform .2s ease;
    cursor: pointer;
  }
  .drop:hover, .drop.over { transform: rotate(0deg) scale(1.03); }
  .drop:focus-within { outline: 2px dashed var(--stamp); outline-offset: 4px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop .frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    aspect-ratio: 4 / 3;
    padding: 12px;
    border: 2px dashed rgba(29, 42, 80, .3);
    background: #efe9dc;
    text-align: center;
  }
  .drop.over .frame { border-color: var(--stamp); background: #f6e3e0; }
  .drop .frame svg { width: 46px; height: 46px; color: var(--stamp); transform: rotate(-8deg); }
  .drop .frame b { font-weight: 400; font-size: 21px; line-height: 1.2; }
  .drop .frame small { font-size: 15px; color: var(--ink-soft); }
  .drop .caption { display: block; text-align: center; font-size: 19px; line-height: 46px; color: #333; }

  /* Pictures picked but not stuck on yet, each with its caption and day */
  .tray { margin: 48px 0 0; }
  .tray[hidden] { display: none; }
  .tray h2 { margin: 0 0 22px; font-size: 30px; line-height: 1.2; font-weight: 400; }
  .tray ul { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 34px 26px; margin: 0; padding: 0; list-style: none; }
  .tray li { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 12px; background: var(--polaroid); box-shadow: 0 2px 4px rgba(40, 30, 20, .22), 0 6px 14px rgba(40, 30, 20, .14); }
  .tray img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; }
  .tray input { width: 100%; border: 0; border-bottom: 1.5px dashed rgba(29, 42, 80, .3); background: transparent; font-size: 18px; padding: 2px 0; outline: none; }
  .tray input:focus { border-bottom-color: var(--stamp); }
  .tray input[type="date"] { font-size: 16px; color: var(--ink-soft); }
  .tray .off { position: absolute; top: 4px; right: 6px; z-index: 2; width: 30px; height: 30px; border: 0; border-radius: 50%; background: rgba(251, 248, 241, .9); font-size: 20px; line-height: 1; cursor: pointer; }
  .tray .state { font-size: 15px; color: var(--ink-soft); min-height: 1.3em; }
  .tray .state.bad { color: var(--stamp); }
  .tray .buttons { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 30px; }

  /* The wall */
  #months { margin-top: 64px; }
  #months .hint { margin: 0 0 24px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 40px 28px; margin: 0; padding: 0; list-style: none; }
  .wall li:nth-child(5n+1) { --tilt: -2.2deg; --tape: 4deg; }
  .wall li:nth-child(5n+2) { --tilt: 1.6deg; --tape: -3deg; }
  .wall li:nth-child(5n+3) { --tilt: -.6deg; --tape: 2deg; }
  .wall li:nth-child(5n+4) { --tilt: 2.4deg; --tape: -5deg; }
  .wall li:nth-child(5n+5) { --tilt: -1.4deg; --tape: 1deg; }
  .wall .card {
    position: relative;
    background: var(--polaroid);
    box-shadow: 0 2px 4px rgba(40, 30, 20, .22), 0 6px 14px rgba(40, 30, 20, .14);
    transform: rotate(var(--tilt));
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .wall .card:hover { transform: rotate(0deg) scale(1.04); box-shadow: 0 4px 8px rgba(40, 30, 20, .22), 0 14px 28px rgba(40, 30, 20, .2); z-index: 2; }
  .wall .open {
    display: flex;
    flex-direction: column;
    width: 100%;
    padding: 10px 10px 0;
    border: 0;
    background: none;
    text-align: center;
    cursor: zoom-in;
  }
  .wall .shot { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #d9d2c4; }
  .wall .words { display: block; padding: 8px 2px 0; font-size: 18px; line-height: 1.25; color: #333; overflow-wrap: anywhere; }
  .wall .words:empty { display: none; }
  /* under each picture, like Instagram: the day on the left, the comment bubble on the right */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 8px 8px 12px; font-size: 14px; color: var(--ink-soft); }
  .bubble {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 36px;
    padding: 0 6px;
    border: 0;
    background: none;
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
  }
  .bubble svg { width: 24px; height: 24px; }
  .bubble:hover svg { color: var(--stamp); }
  .empty { margin-top: 56px; text-align: center; color: var(--ink-soft); font-weight: 300; }

  /* One picture, big */
  .viewer {
    width: 100vw;
    max-width: 100vw;
    height: 100dvh;
    max-height: 100dvh;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
  }
  .viewer::backdrop { background: rgba(20, 18, 28, .82); }
  .viewer[open] { display: grid; place-items: safe center; overflow-y: auto; }
  .viewer figure {
    position: relative;
    display: flex;
    flex-direction: column;
    max-width: calc(100vw - 32px);
    margin: 16px 0;
    padding: 14px 14px 0;
    background: var(--polaroid);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }
  .viewer img { display: block; max-width: calc(100vw - 60px); max-height: calc(100dvh - 190px); object-fit: contain; background: #222; }
  .viewer figcaption { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 14px; padding: 6px 0 10px; }
  .viewer .text { flex: 1 1 260px; max-width: 60ch; font-size: 21px; line-height: 1.3; overflow-wrap: anywhere; }
  .viewer .meta { font-size: 15px; color: var(--ink-soft); }

  .viewer .when { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-soft); }
  /* the day is a date box that looks like plain text: tap it to pick another day */
  .viewer .when input { border: 0; border-bottom: 1.5px dashed rgba(29, 42, 80, .35); background: transparent; color: var(--ink); font-size: 15px; padding: 2px 0; cursor: pointer; }
  .viewer .all { width: 100%; text-align: left; font-size: 16px; }

  /* Comments: a sheet that slides up from the bottom, the way Instagram does it */
  .sheet {
    width: min(100vw, 520px);
    max-width: 100vw;
    height: min(75dvh, 640px);
    margin: auto auto 0;
    padding: 0;
    border: 0;
    border-radius: 18px 18px 0 0;
    background: var(--polaroid);
    color: var(--ink);
    box-shadow: 0 -10px 40px rgba(0, 0, 0, .3);
  }
  .sheet[open] { display: flex; flex-direction: column; animation: up .25s ease-out; }
  .sheet::backdrop { background: rgba(20, 18, 28, .45); }
  @keyframes up { from { transform: translateY(40%); opacity: 0; } }
  .sheet header { position: relative; padding: 18px 16px 10px; border-bottom: 1px solid rgba(29, 42, 80, .12); text-align: center; font-weight: 500; }
  .sheet header::before { content: ""; position: absolute; top: 7px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: rgba(29, 42, 80, .25); }
  .sheet .x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; }
  .sheet ul { flex: 1; margin: 0; padding: 8px 16px; overflow-y: auto; list-style: none; }
  .sheet li { display: flex; gap: 12px; padding: 10px 0; }
  .sheet .none { flex-direction: column; align-items: center; gap: 4px; padding-top: 48px; text-align: center; color: var(--ink-soft); }
  .sheet .none b { font-size: 22px; font-weight: 500; color: var(--ink); }
  .avatar { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fbf6ea; font-size: 16px; font-style: normal; }
  .avatar.Aarya { background: var(--stamp); }
  .sheet .said { flex: 1; min-width: 0; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
  .sheet .said b { font-weight: 500; margin-right: 6px; }
  .sheet .said small { display: flex; gap: 14px; margin-top: 2px; font-size: 13px; color: var(--ink-soft); }
  .sheet .said .plain { font-size: 13px; padding: 0; }
  .sheet form { display: flex; align-items: center; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(29, 42, 80, .12); }
  .sheet form input { flex: 1; min-width: 0; height: 40px; padding: 0 14px; border: 1px solid rgba(29, 42, 80, .2); border-radius: 999px; background: #fff; font-size: 17px; outline: none; }
  .sheet form input:focus { border-color: var(--stamp); }
  .sheet .post { border: 0; background: none; padding: 0; color: var(--stamp); font-weight: 500; cursor: pointer; }
  .sheet .post:disabled { opacity: .4; cursor: default; }
  .viewer .close, .viewer .step {
    position: fixed;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: rgba(251, 248, 241, .92);
    color: var(--ink);
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
  }
  .viewer .close { top: 16px; right: 16px; }
  .viewer .step { top: 50%; transform: translateY(-50%); }
  .viewer .prev { left: 16px; }
  .viewer .next { right: 16px; }
  .viewer .step:disabled { opacity: 0; pointer-events: none; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 20;
    transform: translateX(-50%);
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--ink);
    color: #fbf6ea;
    font-size: 17px;
    box-shadow: 0 6px 20px rgba(29, 42, 80, .3);
  }
  .toast[hidden] { display: none; }

  @media (max-width: 600px) {
    .lock { padding-left: 24px; font-size: 21px; }
    .album { padding-top: 20px; }
    .wall { grid-template-columns: repeat(2, 1fr); gap: 30px 18px; }
    .wall .words { font-size: 16px; }
    .bar { padding-left: 8px; font-size: 13px; }
    .viewer .step { top: auto; bottom: 16px; transform: none; }
    .viewer img { max-height: calc(100dvh - 240px); }
    .viewer figure { margin-bottom: 80px; }
    .sheet { width: 100vw; }
    .back { left: 14px; bottom: 14px; }
  }
  @media (min-width: 700px) {
    .sheet { margin: auto; border-radius: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .drop, .wall .card { transition: none; }
    .sheet[open] { animation: none; }
  }
  /* Hold a card and drag it to change the order; the order is saved for both of us */
  .hint { margin: -10px 0 18px; font-size: 15px; line-height: 1.4; color: var(--ink-soft); font-weight: 300; }
  [data-id] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .sortable-ghost { opacity: .35; }
  .sortable-drag { cursor: grabbing; }
</style>
</head>
<body>

<section class="lock" id="lock" hidden>
  <p>हाम्रा तस्बिरहरू हेर्न password:</p>
  <form id="form" autocomplete="off">
    <input id="pw" type="password" placeholder="..........." aria-label="Password">
    <button id="btn" type="submit">खोल</button>
  </form>
  <p class="error" id="err" role="alert"></p>
</section>

<main class="album" id="album" hidden>
  <h1>हाम्रा तस्बिरहरू</h1>
  <p class="sub">every picture of us, kept in one place</p>

  <label class="drop tape" id="drop">
    <input id="pick" type="file" accept="image/*" multiple>
    <span class="frame">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
      <b>stick our pictures here</b>
      <small>tap to pick, or drop them on</small>
    </span>
    <span class="caption">as many as you like</span>
  </label>

  <section class="tray" id="tray" hidden>
    <h2>ready to stick on</h2>
    <ul id="tray-list"></ul>
    <div class="buttons">
      <button class="pill red solid" id="stick" type="button">टाँस</button>
      <button class="plain" id="tray-cancel" type="button">Cancel</button>
    </div>
  </section>

  <div id="months"></div>
</main>

<dialog class="viewer" id="viewer" aria-label="Picture">
  <figure>
    <img id="view-img" alt="">
    <figcaption>
      <button class="bubble" id="view-bubble" type="button" aria-label="Comments"></button>
      <span class="when"><input id="view-day" type="date" aria-label="Day of this picture"><span id="view-by"></span></span>
      <span class="text" id="view-text"></span>
      <button class="plain all" id="view-all" type="button"></button>
      <button class="plain" id="view-remove" type="button" hidden>remove</button>
    </figcaption>
  </figure>
  <button class="close" id="view-close" type="button" aria-label="Close">×</button>
  <button class="step prev" id="view-prev" type="button" aria-label="Newer picture">‹</button>
  <button class="step next" id="view-next" type="button" aria-label="Older picture">›</button>
</dialog>

<dialog class="sheet" id="sheet" aria-label="Comments">
  <header>Comments<button class="x" id="sheet-close" type="button" aria-label="Close">×</button></header>
  <ul id="sheet-list"></ul>
  <form id="comment-form" autocomplete="off">
    <span class="avatar" id="me-avatar" aria-hidden="true"></span>
    <input id="comment-text" type="text" maxlength="500" placeholder="Add a comment..." aria-label="Add a comment">
    <button class="post" id="comment-post" type="submit" disabled>Post</button>
  </form>
</dialog>

<p class="toast" id="toast" role="status" hidden></p>
<a class="back" href="./">← चिठी</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
  const API = "https://for-aarya-bot.netlify.app/api";
  const $ = id => document.getElementById(id);
  const remember = {
    get: () => { try { return sessionStorage.getItem("letter-password") ?? ""; } catch { return ""; } },
    set: v => { try { sessionStorage.setItem("letter-password", v); } catch { /* private window */ } },
  };
  let password = remember.get();
  let me = "";

  function el(tag, props = {}, kids = []) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...kids);
    return node;
  }

  async function api(path, body) {
    const res = await fetch(API + path, {
      method: body ? "POST" : "GET",
      headers: { "x-letter-password": password, ...(body ? { "content-type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || "Something went wrong. Try again."), { status: res.status });
    return data;
  }

  let toastTimer;
  function toast(text) {
    $("toast").textContent = text;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, 2600);
  }

  // The pictures need the password, so they are fetched here and kept as object URLs.
  const urls = new Map();  // "<id>/thumb" or "<id>/photo" -> object URL
  async function imageUrl(id, size) {
    const key = `${id}/${size}`;
    if (!urls.has(key)) {
      const res = await fetch(`${API}/pictures/${key}`, { headers: { "x-letter-password": password } });
      if (!res.ok) throw new Error("picture missing");
      urls.set(key, URL.createObjectURL(await res.blob()));
    }
    return urls.get(key);
  }
  // small copies load as they come near the screen
  const nearby = new IntersectionObserver(entries => {
    for (const { isIntersecting, target } of entries) {
      if (!isIntersecting) continue;
      nearby.unobserve(target);
      imageUrl(target.dataset.id, "thumb").then(url => { target.src = url; }).catch(() => { target.alt = "This picture could not load."; });
    }
  }, { rootMargin: "400px" });

  // A picture's day is the day it was posted, unless one of us changed it
  const dayOf = p => p.taken ?? p.added.slice(0, 10);
  const day = p => new Date(dayOf(p) + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  // today on this phone's calendar, which can differ from the UTC one
  const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

  const BUBBLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.7 16.3A9 9 0 1 0 17.6 20l3.9 1.1z"/></svg>';
  function bubble(p, button = el("button", { type: "button", className: "bubble" })) {
    const n = p.comments?.length ?? 0;
    button.innerHTML = BUBBLE + (n ? `<span>${n}</span>` : "");
    button.ariaLabel = n ? `${n} comment${n === 1 ? "" : "s"}` : "Add a comment";
    button.onclick = () => openComments(p.id);
    return button;
  }

  // ---- the wall -----------------------------------------------------------

  let pictures = [];

  function polaroid(p, index) {
    const img = el("img", { className: "shot", alt: p.caption || `A picture from ${day(p)}` });
    img.dataset.id = p.id;
    nearby.observe(img);
    const open = el("button", { type: "button", className: "open" }, [img, el("span", { className: "words", textContent: p.caption })]);
    open.addEventListener("click", () => show(index));
    const li = el("li", {}, [el("div", { className: "card tape" }, [open, el("div", { className: "bar" }, [el("span", { textContent: day(p) }), bubble(p)])])]);
    li.dataset.id = p.id;
    return li;
  }


  // Hold a card (or press and drag with a mouse) to move it; the new order is saved for both of us.
  // On a phone the hold keeps an ordinary swipe scrolling the page.
  let dragging = false;
  function draggable(list, kind, moved) {
    if (!window.Sortable) return;
    Sortable.create(list, {
      draggable: "li[data-id]",
      animation: 180,
      delay: 250,
      delayOnTouchOnly: true,
      touchStartThreshold: 6,
      onStart: () => { dragging = true; },
      onEnd: async e => {
        dragging = false;
        if (e.oldIndex === e.newIndex) return;
        const ids = [...list.children].map(li => li.dataset.id).filter(Boolean);
        try { await api(`/${kind}/order`, { ids }); moved?.(ids); }
        catch (err) { toast(err.message); loadPictures(); }
      },
    });
  }

  function drawWall() {
    if (!pictures.length) {
      $("months").replaceChildren(el("p", { className: "empty", textContent: "No pictures yet. Stick the first one on." }));
      return;
    }
    const wall = el("ul", { className: "wall" }, pictures.map(polaroid));
    $("months").replaceChildren(el("p", { className: "hint", textContent: "Hold one and drag it to move it." }), wall);
    // the big view's next and previous follow the new order
    draggable(wall, "pictures", ids => { pictures = ids.map(id => pictures.find(p => p.id === id)).filter(Boolean); drawWall(); });
  }

  async function loadPictures() {
    try {
      const [{ pictures: list }, { me: who }] = await Promise.all([api("/pictures"), me ? { me } : api("/settings")]);
      me = who ?? "";
      if (JSON.stringify(list) !== JSON.stringify(pictures)) { pictures = list; drawWall(); }
      else if (!$("months").children.length) drawWall();
      $("album").hidden = false;
      $("lock").hidden = true;
      return true;
    } catch (e) {
      if (e.status === 401) {
        remember.set("");
        $("album").hidden = true;
        $("lock").hidden = false;
        $("pw").focus();
      } else if ($("album").hidden) {
        // server asleep or offline: say so, and the खोल button tries again
        $("lock").hidden = false;
        $("err").textContent = "The server isn't answering. Try खोल again in a minute.";
      }
      return false;
    }
  }

  // ---- one picture, big ---------------------------------------------------

  const viewer = $("viewer");
  let showing = -1;

  async function show(index) {
    const p = pictures[index];
    if (!p) return;
    showing = index;
    const img = $("view-img");
    img.alt = p.caption || `A picture from ${day(p)}`;
    // the small copy straight away, the full one once it arrives
    img.src = urls.get(`${p.id}/thumb`) ?? "";
    $("view-text").textContent = p.caption;
    $("view-day").value = dayOf(p);
    $("view-day").max = today();
    $("view-by").textContent = `added by ${p.by}`;
    drawCounts(p);
    $("view-remove").hidden = p.by !== me;
    $("view-remove").textContent = "remove";
    $("view-prev").disabled = index === 0;
    $("view-next").disabled = index === pictures.length - 1;
    if (!viewer.open) viewer.showModal();
    try {
      const url = await imageUrl(p.id, "photo");
      if (showing === index) img.src = url;
    } catch {
      if (showing === index) toast("The big picture could not load.");
    }
  }

  $("view-close").addEventListener("click", () => viewer.close());
  $("view-prev").addEventListener("click", () => show(showing - 1));
  $("view-next").addEventListener("click", () => show(showing + 1));
  viewer.addEventListener("click", e => { if (e.target === viewer) viewer.close(); });
  viewer.addEventListener("close", () => { showing = -1; });
  viewer.addEventListener("keydown", e => {
    if (e.target.closest("input")) return;  // arrows move the cursor in the comment box
    if (e.key === "ArrowLeft" && showing > 0) show(showing - 1);
    if (e.key === "ArrowRight" && showing < pictures.length - 1) show(showing + 1);
  });

  // the day under a picture can be changed by either of us
  $("view-day").addEventListener("change", async () => {
    const p = pictures[showing], taken = $("view-day").value;
    if (!p || !taken || taken === dayOf(p)) return;
    try { replacePicture((await api(`/pictures/${p.id}/day`, { taken })).picture); toast("Day changed."); }
    catch (e) { $("view-day").value = dayOf(p); toast(e.message); }
  });

  // ---- comments -----------------------------------------------------------

  const sheet = $("sheet");
  let sheetFor = "";  // id of the picture whose comments are open

  // "now", "5m", "3h", "2d", "4w", like Instagram
  function ago(iso) {
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 60) return "now";
    for (const [unit, size] of [["w", 604800], ["d", 86400], ["h", 3600], ["m", 60]]) if (s >= size) return Math.floor(s / size) + unit;
  }

  const avatar = name => el("span", { className: `avatar ${name}`, textContent: name[0] ?? "?", ariaHidden: "true" });

  function drawCounts(p) {
    bubble(p, $("view-bubble"));
    const n = p.comments?.length ?? 0;
    $("view-all").textContent = n ? (n === 1 ? "View 1 comment" : `View all ${n} comments`) : "Add a comment...";
    $("view-all").onclick = () => openComments(p.id);
  }

  function drawSheet() {
    const p = pictures.find(x => x.id === sheetFor);
    if (!p) return;
    const list = p.comments ?? [];
    $("sheet-list").replaceChildren(...(list.length ? list.map(c => {
      const when = el("small", {}, [ago(c.date)]);
      if (c.by === me) {
        // two clicks, so nothing goes from a slip
        const b = el("button", { type: "button", className: "plain", textContent: "Delete" });
        b.addEventListener("click", async () => {
          if (b.textContent === "Delete") { b.textContent = "Sure? Delete"; return; }
          b.disabled = true;
          try { replacePicture((await api(`/pictures/${p.id}/uncomment`, { comment: c.id })).picture); }
          catch (e) { b.disabled = false; toast(e.message); }
        });
        when.append(b);
      }
      return el("li", {}, [avatar(c.by), el("div", { className: "said" }, [el("b", { textContent: c.by }), c.text, when])]);
    }) : [el("li", { className: "none" }, [el("b", { textContent: "No comments yet" }), "Say something about this one."])]));
    $("sheet-list").scrollTop = $("sheet-list").scrollHeight;
  }

  function openComments(id) {
    sheetFor = id;
    $("me-avatar").replaceWith(Object.assign(avatar(me), { id: "me-avatar" }));
    drawSheet();
    if (!sheet.open) sheet.showModal();
    $("comment-text").focus();
  }

  // keeps the wall, the big view and the comments in step with what the server sent back
  function replacePicture(next) {
    const i = pictures.findIndex(p => p.id === next.id);
    if (i < 0) return;
    pictures[i] = next;
    drawWall();
    if (showing === i) { drawCounts(next); $("view-day").value = dayOf(next); }
    if (sheetFor === next.id) drawSheet();
  }

  $("sheet-close").addEventListener("click", () => sheet.close());
  sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
  sheet.addEventListener("close", () => { sheetFor = ""; });
  $("comment-text").addEventListener("input", () => { $("comment-post").disabled = !$("comment-text").value.trim(); });

  $("comment-form").addEventListener("submit", async e => {
    e.preventDefault();
    const input = $("comment-text");
    if (!sheetFor || !input.value.trim()) return;
    $("comment-post").disabled = true;
    try {
      replacePicture((await api(`/pictures/${sheetFor}/comment`, { text: input.value })).picture);
      input.value = "";
    } catch (err) {
      toast(err.message);
      $("comment-post").disabled = false;
    }
    input.focus();
  });

  // two clicks, so nothing goes from a slip
  $("view-remove").addEventListener("click", async () => {
    const b = $("view-remove");
    if (b.textContent === "remove") { b.textContent = "sure? remove it"; return; }
    const p = pictures[showing];
    b.disabled = true;
    try {
      await api(`/pictures/${p.id}/delete`, {});
      pictures = pictures.filter(x => x.id !== p.id);
      viewer.close();
      drawWall();
      toast("Taken off the wall.");
    } catch (e) {
      toast(e.message);
    } finally {
      b.disabled = false;
    }
  });

  // ---- adding pictures ----------------------------------------------------

  // Shrink to a JPEG no longer than `side` on the long side, as base64.
  async function shrink(bitmap, side, quality) {
    const scale = Math.min(1, side / Math.max(bitmap.width, bitmap.height));
    const canvas = el("canvas", { width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale) });
    canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(done => canvas.toBlob(done, "image/jpeg", quality));
    const dataUrl = await new Promise(done => {
      const reader = new FileReader();
      reader.onload = () => done(reader.result);
      reader.readAsDataURL(blob);
    });
    return dataUrl.slice(dataUrl.indexOf(",") + 1);
  }

  let waiting = [];  // { file, preview, caption, date, state, li }

  function addToTray(files) {
    const photos = [...files].filter(f => f.type.startsWith("image/"));
    if (photos.length < files.length) toast("Only pictures can go on the wall.");
    for (const file of photos) {
      const item = { file, preview: URL.createObjectURL(file) };
      item.caption = el("input", { type: "text", maxLength: 300, placeholder: "write something under it...", ariaLabel: "Caption" });
      item.date = el("input", { type: "date", value: today(), max: today(), ariaLabel: "Day of this picture" });
      item.state = el("span", { className: "state" });
      const off = el("button", { type: "button", className: "off", textContent: "×", ariaLabel: "Take this one off" });
      item.li = el("li", { className: "tape" }, [off, el("img", { src: item.preview, alt: "" }), item.caption, item.date, item.state]);
      off.addEventListener("click", () => dropFromTray(item));
      waiting.push(item);
      $("tray-list").append(item.li);
    }
    $("tray").hidden = !waiting.length;
    if (photos.length) waiting.at(-photos.length).caption.focus({ preventScroll: true });
    $("tray").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function dropFromTray(item) {
    URL.revokeObjectURL(item.preview);
    item.li.remove();
    waiting = waiting.filter(w => w !== item);
    $("tray").hidden = !waiting.length;
  }

  $("pick").addEventListener("change", () => { addToTray($("pick").files); $("pick").value = ""; });
  const drop = $("drop");
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); addToTray(e.dataTransfer.files); });

  $("tray-cancel").addEventListener("click", () => [...waiting].forEach(dropFromTray));

  // One at a time, so a big batch doesn't go over what the server takes in one request.
  $("stick").addEventListener("click", async () => {
    const stick = $("stick");
    stick.disabled = true;
    let stuck = 0;
    for (const item of [...waiting]) {
      item.state.className = "state";
      item.state.textContent = "sticking it on...";
      try {
        const bitmap = await createImageBitmap(item.file, { imageOrientation: "from-image" });
        let photo = await shrink(bitmap, 2000, 0.85);
        if (photo.length > 4_000_000) photo = await shrink(bitmap, 2000, 0.7);  // base64 of about 3 MB
        const thumb = await shrink(bitmap, 600, 0.8);
        await api("/pictures", { photo, thumb, caption: item.caption.value, taken: item.date.value });
        dropFromTray(item);
        stuck++;
      } catch (e) {
        item.state.className = "state bad";
        item.state.textContent = e.status ? e.message : "This one didn't work. Try a JPEG or PNG.";
      }
    }
    stick.disabled = false;
    if (stuck) {
      toast(stuck === 1 ? "On the wall." : `${stuck} pictures on the wall.`);
      await loadPictures();
    }
  });

  // ---- unlocking ----------------------------------------------------------

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    password = $("pw").value.trim();
    $("err").textContent = "";
    if (await loadPictures()) remember.set(password);
    else $("err").textContent = "हैन नि, फेरि लेख त।";
  });

  // Pick up what the other one adds without a reload
  const refresh = () => { if (!document.hidden && !$("album").hidden && !viewer.open && !sheet.open && !dragging) loadPictures(); };
  setInterval(refresh, 60000);
  document.addEventListener("visibilitychange", refresh);

  if (password) loadPictures();
  else { $("lock").hidden = false; $("pw").focus(); }
</script>
</body>
</html>
